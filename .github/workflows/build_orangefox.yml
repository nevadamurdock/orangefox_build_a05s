name: Build OrangeFox Recovery for Galaxy A05s

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        sudo apt-get clean
        sudo apt-get update
        df -h

    - name: Increase Swap Space (Prevent OOM)
      run: |
        sudo swapoff -a
        sudo fallocate -l 12G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get install -y gawk coreutils bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox Base Source via Official Script
      env:
        GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      run: |
        git config --global user.name "nevadamurdock"
        git config --global user.email "nevadamurdock@gmail.com"
        
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        
        git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/OrangeFox/sync.git
        
        cd ~/OrangeFox_sync/sync/
        chmod +x orangefox_sync.sh
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: DEBUG - Verify base OrangeFox source integrity
      run: |
        echo "=== Checking orangefox_soong.mk right after official sync (before any of our changes) ==="
        ls -la ~/fox_12.1/bootable/recovery/orangefox_soong.mk || echo "!!! MISSING RIGHT AFTER orangefox_sync.sh !!!"
        echo "=== Checking for pre-existing device/samsung/a05s entry in base manifest ==="
        grep -A2 "device/samsung/a05s" ~/fox_12.1/.repo/manifest.xml || echo "No existing entry found in base manifest"
        echo "=== git log of bootable/recovery (last 5 commits) ==="
        cd ~/fox_12.1/bootable/recovery && git log --oneline -5 || echo "Could not read git log"

    - name: Purge Corrupt Checkout State & Setup Local Manifests
      run: |
        cd ~/fox_12.1
        
        # Bersihkan direktori device tree lama agar tidak terjadi konflik path
        # (bootable/recovery TIDAK disentuh sama sekali - source resmi OrangeFox dari
        # orangefox_sync.sh sudah benar, terbukti dari step DEBUG sebelumnya)
        rm -rf device/samsung/a05s
        rm -rf vendor/samsung/a05s
        rm -rf kernel/samsung/a05s
        
        mkdir -p .repo/local_manifests
        cat << 'MANIFEST' > .repo/local_manifests/a05s.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com" />
          <project path="device/samsung/a05s" name="nevadamurdock/android_device_samsung_a05s" remote="github" revision="fox_12.1" />
          <project path="vendor/samsung/a05s" name="nevadamurdock/android_vendor_samsung_a05s" remote="github" revision="main" />
          <project path="kernel/samsung/a05s" name="nevadamurdock/android_kernel_samsung_a05s" remote="github" revision="main" />
        </manifest>
        MANIFEST

        # HANYA sync 3 project device tree custom ini secara spesifik.
        # (hardware/samsung DIHAPUS - tidak dibutuhkan untuk build recovery,
        # dan Android.bp di dalamnya pakai sintaks AIDL yang tidak kompatibel
        # dengan Soong versi Android 12 yang dipakai OrangeFox 12.1)
        # TIDAK melakukan repo sync tanpa argumen (yang akan sync ULANG semua project
        # termasuk bootable/recovery yang sudah benar, dan berpotensi merusaknya lagi).
        ~/bin/repo sync -c --force-sync --force-checkout --no-clone-bundle --no-tags -j1 \
          device/samsung/a05s vendor/samsung/a05s kernel/samsung/a05s

    - name: Compile OrangeFox Recovery
      run: |
        cd ~/fox_12.1
        
        # Bersihkan folder output recovery lama untuk hindari konflik rsync
        # (symlink vs folder biasa) saat proses packaging ramdisk final
        rm -rf out/target/product/a05s/recovery
        
        /bin/bash -c "
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=a05s
          export LC_ALL='C'
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_LOG=1
          
          source build/envsetup.sh
          
          lunch fox_a05s-eng || exit 1
          mka adbd bootimage -j4
        "

    - name: DEBUG - List Actual Build Output
      if: always()
      run: |
        echo "=== Isi folder output produk (apa adanya) ==="
        ls -la ~/fox_12.1/out/target/product/a05s/ 2>&1 || echo "Folder tidak ditemukan"
        echo ""
        echo "=== Cari semua file .img, .zip, .tar di folder out (siapa tahu nama/lokasinya beda) ==="
        find ~/fox_12.1/out/target/product/a05s/ -maxdepth 2 \( -name "*.img" -o -name "*.zip" -o -name "*.tar*" \) 2>&1 || echo "Tidak ada file ditemukan"

    - name: Package for Odin Flashing (.tar)
      continue-on-error: true
      run: |
        cd ~/fox_12.1/out/target/product/a05s
        
        # Device ini pakai recovery-as-boot (tidak ada partisi recovery terpisah),
        # jadi yang perlu di-flash ke partisi "boot" via Odin adalah boot.img
        tar -H ustar -c -f recovery-odin.tar boot.img
        md5sum recovery-odin.tar >> recovery-odin.tar
        mv recovery-odin.tar recovery-odin.tar.md5
        
        ls -la recovery-odin.tar.md5

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_A05s_Build
        path: |
          ~/fox_12.1/out/target/product/a05s/OrangeFox-*.zip
          ~/fox_12.1/out/target/product/a05s/OrangeFox-*.img
          ~/fox_12.1/out/target/product/a05s/recovery-odin.tar.md5
          ~/fox_12.1/out/target/product/a05s/boot.img
          ~/fox_12.1/out/target/product/a05s/vendor_boot.img

name: Build OrangeFox Recovery for Galaxy A05s

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        sudo apt-get clean

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk coreutils bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize OrangeFox Source
      env:
        GIT_TERMINAL_PROMPT: 0
      run: |
        mkdir -p ~/orangefox
        cd ~/orangefox
        
        # Konfigurasi Git Global agar tidak prompt password & force HTTP/1.1 jika butuh
        git config --global user.name "nevadamurdock"
        git config --global user.email "nevadamurdock@gmail.com"
        git config --global credential.helper store
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        
        # Inisialisasi manifest
        repo init -u https://gitlab.com/OrangeFox/sync/manifest.git -b fox_12.1 --depth=1 || \
        repo init -u https://github.com/OrangeFoxRecovery/manifest.git -b fox_12.1 --depth=1

    - name: Inject Local Manifests (a05s)
      run: |
        cd ~/orangefox
        mkdir -p .repo/local_manifests
        cat << 'MANIFEST' > .repo/local_manifests/a05s.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com" />
          <project path="device/samsung/a05s" name="nevadamurdock/android_device_samsung_a05s" remote="github" revision="main" />
          <project path="vendor/samsung/a05s" name="nevadamurdock/android_vendor_samsung_a05s" remote="github" revision="main" />
          <project path="hardware/samsung" name="nevadamurdock/android_hardware_samsung" remote="github" revision="main" />
          <project path="kernel/samsung/a05s" name="nevadamurdock/android_kernel_samsung_a05s" remote="github" revision="main" />
        </manifest>
        MANIFEST

    - name: Sync Sources
      env:
        GIT_TERMINAL_PROMPT: 0
      run: |
        cd ~/orangefox
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Building OrangeFox Image
      run: |
        cd ~/orangefox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        lunch twrp_a05s-eng || lunch omni_a05s-eng || lunch lineage_a05s-userdebug
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_A05s_Output
        path: |
          ~/orangefox/out/target/product/a05s/OrangeFox*.zip
          ~/orangefox/out/target/product/a05s/recovery.img
          ~/orangefox/out/target/product/a05s/vendor_boot.img
          ~/orangefox/out/target/product/a05s/boot.img

name: Build OrangeFox Recovery (mlm-games Engine)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox for A05s
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cleanup Environment & Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        sudo apt-get clean
        sudo apt-get update

    - name: Install Build Dependencies
      run: |
        sudo apt-get install -y gawk coreutils bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Setup Repo Binaries (Standalone)
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize OrangeFox Manifest
      run: |
        mkdir -p ~/orangefox
        cd ~/orangefox
        
        git config --global user.name "nevadamurdock"
        git config --global user.email "nevadamurdock@gmail.com"
        
        # Bypass prompt autentikasi git & gitlab
        git config --global http.postBuffer 524288000
        git config --global http.sslVerify false
        
        ~/bin/repo init -u https://gitlab.com/OrangeFox/sync/manifest.git -b fox_12.1 --depth=1 --no-repo-verify

    - name: Inject Local Manifests (nevadamurdock/a05s)
      run: |
        cd ~/orangefox
        mkdir -p .repo/local_manifests
        cat << 'MANIFEST' > .repo/local_manifests/a05s.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com" />
          <project path="device/samsung/a05s" name="nevadamurdock/android_device_samsung_a05s" remote="github" revision="main" />
          <project path="vendor/samsung/a05s" name="nevadamurdock/android_vendor_samsung_a05s" remote="github" revision="main" />
          <project path="hardware/samsung" name="nevadamurdock/android_hardware_samsung" remote="github" revision="main" />
          <project path="kernel/samsung/a05s" name="nevadamurdock/android_kernel_samsung_a05s" remote="github" revision="main" />
        </manifest>
        MANIFEST

    - name: Sync Sources (Optimized)
      run: |
        cd ~/orangefox
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Compile OrangeFox Recovery
      run: |
        cd ~/orangefox
        source build/envsetup.sh
        
        # Flag Lingkungan & OrangeFox Engine
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        # Target Lunch A05s
        lunch twrp_a05s-eng || lunch omni_a05s-eng || lunch lineage_a05s-userdebug
        
        # Eksekusi Build Recovery
        mka recoveryimage -j$(nproc --all) || mka vendorbootimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_A05s_Build
        path: |
          ~/orangefox/out/target/product/a05s/OrangeFox*.zip
          ~/orangefox/out/target/product/a05s/recovery.img
          ~/orangefox/out/target/product/a05s/vendor_boot.img
          ~/orangefox/out/target/product/a05s/boot.img

name: Build OrangeFox Recovery for Galaxy A05s

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        sudo apt-get clean
        sudo apt-get update

    - name: Install Build Dependencies
      run: |
        sudo apt-get install -y gawk coreutils bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox Source (Official Wiki Command)
      env:
        GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      run: |
        git config --global user.name "nevadamurdock"
        git config --global user.email "nevadamurdock@gmail.com"
        
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        
        git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/OrangeFox/sync.git
        
        cd ~/OrangeFox_sync/sync/
        chmod +x orangefox_sync.sh
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Inject Local Manifests & Fix Checkout State
      run: |
        cd ~/fox_12.1
        
        # Bersihkan konflik git state di bootable/recovery
        rm -rf bootable/recovery/.git/index.lock || true
        
        mkdir -p .repo/local_manifests
        cat << 'MANIFEST' > .repo/local_manifests/a05s.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com" />
          <project path="device/samsung/a05s" name="nevadamurdock/android_device_samsung_a05s" remote="github" revision="main" />
          <project path="vendor/samsung/a05s" name="nevadamurdock/android_vendor_samsung_a05s" remote="github" revision="main" />
          <project path="hardware/samsung" name="nevadamurdock/android_hardware_samsung" remote="github" revision="main" />
          <project path="kernel/samsung/a05s" name="nevadamurdock/android_kernel_samsung_a05s" remote="github" revision="main" />
        </manifest>
        MANIFEST

    - name: Sync Device Sources
      run: |
        cd ~/fox_12.1
        # Menggunakan --force-checkout dan -j4 untuk menghindari sync error pada bootable/recovery
        ~/bin/repo sync -c --force-sync --force-checkout --no-clone-bundle --no-tags -j4

    - name: Compile OrangeFox Recovery
      run: |
        cd ~/fox_12.1
        source build/envsetup.sh
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        lunch twrp_a05s-eng || lunch omni_a05s-eng || lunch lineage_a05s-userdebug
        mka recoveryimage -j$(nproc --all) || mka vendorbootimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_A05s_Build
        path: |
          ~/fox_12.1/out/target/product/a05s/OrangeFox*.zip
          ~/fox_12.1/out/target/product/a05s/recovery.img
          ~/fox_12.1/out/target/product/a05s/vendor_boot.img
          ~/fox_12.1/out/target/product/a05s/boot.img
